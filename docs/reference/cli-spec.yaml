name: keyapi
version: "1.0.0"
description: "A lightweight CLI for configuring, discovering, and calling KeyAPI endpoints."
audience:
  - cli_user
  - programmatic_tool
defaults:
  spec_output: "json"
  call_output: "json"
notes:
  - "Select endpoints by reading method, path, summary, and description from list-endpoints."
  - "Inspect get-endpoint output before calling an endpoint."
  - "OpenAPI JSON files are fetched live from the official docs index."
commands:
  - name: "keyapi"
    description: "Show root help, version, or route to a subcommand."
    usage: "keyapi [--help|--version|show|get|set|clear|spec|call]"
    required: []
    parameters:
      - name: "--help"
        type: "flag"
        required: false
        description: "Show root help."
      - name: "--version"
        type: "flag"
        required: false
        description: "Print CLI version."
    output: "text"

  - name: "keyapi show"
    description: "Show current configuration with the token masked."
    usage: "keyapi show"
    required: []
    parameters: []
    output: "json"

  - name: "keyapi get"
    description: "Show full config when no key is provided, or show one config value."
    usage: "keyapi get [token|api-key|auth-scheme|language|lang]"
    required: []
    parameters:
      - name: "key"
        type: "enum"
        required: false
        values: ["token", "api-key", "auth-scheme", "language", "lang"]
        description: "Optional config key to read."
    output: "json_or_text"

  - name: "keyapi set"
    description: "Save one local config value."
    usage: "keyapi set <token|api-key|auth-scheme|language|lang> <value>"
    required: ["key", "value"]
    parameters:
      - name: "key"
        type: "enum"
        required: true
        values: ["token", "api-key", "auth-scheme", "language", "lang"]
        description: "Config key to set."
      - name: "value"
        type: "string"
        required: true
        description: "Config value. language/lang must be en or zh."
    output: "text"

  - name: "keyapi clear"
    description: "Clear the stored API token."
    usage: "keyapi clear <token|api-key>"
    required: ["key"]
    parameters:
      - name: "key"
        type: "enum"
        required: true
        values: ["token", "api-key"]
        description: "Token key to clear."
    output: "text"

  - name: "keyapi spec list-platforms"
    description: "List platforms that currently have KeyAPI OpenAPI specs."
    usage: "keyapi spec list-platforms"
    required: []
    parameters: []
    output: "json"
    output_schema:
      type: "array"
      items:
        type: "string"
      description: "Supported platform names."

  - name: "keyapi spec list-endpoints"
    description: "List endpoint descriptions for one or more platforms, or all platforms."
    usage: "keyapi spec list-endpoints <platform...|all>"
    required: ["platforms"]
    parameters:
      - name: "platforms"
        type: "string_array"
        required: true
        description: "One or more platform names, or all."
    output: "json"
    output_schema:
      type: "object"
      additional_properties:
        type: "array"
        description: "Endpoints grouped by platform name."
        items:
          type: "object"
          properties:
            method:
              type: "string"
              description: "HTTP request method."
            path:
              type: "string"
              description: "API request path."
            summary:
              type: "string"
              description: "Short endpoint title."
            description:
              type: "string"
              description: "Detailed endpoint description."

  - name: "keyapi spec get-endpoint"
    description: "Get method, path, description, parameters, and body fields for one endpoint."
    usage: "keyapi spec get-endpoint <endpoint-or-path> [--format json|pretty]"
    required: ["endpoint_or_path"]
    parameters:
      - name: "endpoint_or_path"
        type: "string"
        required: true
        description: "Endpoint alias, path, or full KeyAPI URL. Example: google/search."
      - name: "--format"
        type: "enum"
        required: false
        default: "json"
        values: ["json", "pretty"]
        description: "Output format."
    output: "json_by_default"

  - name: "keyapi call"
    description: "Execute a KeyAPI endpoint request."
    usage: "keyapi call <endpoint-or-path-with-query> [--params \"k=v\"] [--body-raw TEXT] [--body-json JSON] [--method METHOD] [--format json|pretty|raw] [--output \"PATH\"] [--dry-run]"
    required: ["endpoint_or_path"]
    parameters:
      - name: "endpoint_or_path"
        type: "string"
        required: true
        description: "Endpoint alias, path with query string, or full KeyAPI URL. Prefer inline query strings for GET endpoints, for example /v1/google/search?q=openai&gl=us."
      - name: "--query"
        type: "quoted_key_value"
        required: false
        repeatable: true
        description: "Add or append a URL query parameter as quoted k=v."
      - name: "--params"
        type: "quoted_key_value"
        required: false
        repeatable: true
        description: "Add or append a URL query parameter as quoted k=v. Useful when query parameters are appended separately from the endpoint path."
      - name: "--body-raw"
        type: "string"
        required: false
        repeatable: false
        description: "Raw text request body. Sent as text/plain without JSON validation."
      - name: "--body-json"
        type: "json"
        required: false
        description: "JSON request body. Must be valid JSON and is sent as application/json. Common PowerShell-mangled object input is normalized when possible."
      - name: "--method"
        type: "string"
        required: false
        description: "HTTP method override. Defaults to POST when a body exists, otherwise GET."
      - name: "--api-key"
        type: "string"
        required: false
        description: "API key for this command only."
      - name: "--token"
        type: "string"
        required: false
        description: "Alias for --api-key."
      - name: "--dry-run"
        type: "flag"
        required: false
        description: "Print request JSON without sending it."
      - name: "--format"
        type: "enum"
        required: false
        default: "json"
        values: ["json", "pretty", "raw"]
        description: "Response output format."
      - name: "--output"
        type: "path"
        required: false
        description: "Write the response body to a file. Quote the path. Relative paths are resolved from the current working directory. Parent directories are created automatically."
    output: "original_api_response_json_by_default; HTTP non-2xx responses print the response and return a non-zero exit code"
